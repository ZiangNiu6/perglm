# Adapted from https://github.com/r-lib/actions/blob/v2/examples/check-standard.yaml
name: R-CMD-check

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          # Posit provides a literal R 4.1.0 binary for this Ubuntu release.
          - {os: ubuntu-22.04, r: '4.1.0'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Verify minimum supported R version
        if: matrix.config.r == '4.1.0'
        run: stopifnot(getRversion() == "4.1.0")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # HTML vignettes are built and checked; only the PDF manual is skipped.
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'
